<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hub</title>
<meta name="description" content="Tablón personal de Maia: UMU y empleo">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#E9EEE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121A16" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hub">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EEE6; --surface:#F7F9F5; --surface-2:#DFE6DB; --ink:#17251E; --ink-2:#4B5D53; --ink-3:#7A8A80;
  --line:#CBD6C7; --pine:#24705F; --pine-ink:#F4FAF6; --ochre:#B7791F; --ochre-soft:#F3E3C2;
  --rust:#B5462F; --rust-soft:#F5DCD3; --sky:#3E6E93; --sky-soft:#D9E6EF;
  --radius-lg:22px; --radius:14px; --radius-sm:9px;
  --font-display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --font-body:"Atkinson Hyperlegible", ui-sans-serif, system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121A16; --surface:#1A241F; --surface-2:#22302A; --ink:#E4ECE6; --ink-2:#A9B9AF; --ink-3:#7E8F85;
    --line:#2E3E36; --pine:#62C2A9; --pine-ink:#0E1D17; --ochre:#E8B95B; --ochre-soft:#3B3020;
    --rust:#EE8A72; --rust-soft:#3D2620; --sky:#8DB9DA; --sky-soft:#1E2E3A; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121A16; --surface:#1A241F; --surface-2:#22302A; --ink:#E4ECE6; --ink-2:#A9B9AF; --ink-3:#7E8F85;
  --line:#2E3E36; --pine:#62C2A9; --pine-ink:#0E1D17; --ochre:#E8B95B; --ochre-soft:#3B3020;
  --rust:#EE8A72; --rust-soft:#3D2620; --sky:#8DB9DA; --sky-soft:#1E2E3A; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;min-height:100dvh;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
a{color:var(--pine)}
:focus-visible{outline:3px solid var(--pine);outline-offset:2px;border-radius:6px}
.hidden{display:none!important}

/* ---------- Lock screen ---------- */
.lock{min-height:100dvh;display:grid;place-items:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom))}
.lock-card{width:100%;max-width:380px}
.lock h1{font-family:var(--font-display);font-weight:800;font-size:44px;line-height:1;letter-spacing:-.02em;margin:0 0 6px}
.lock p{color:var(--ink-2);margin:0 0 24px}
.field{display:flex;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);padding:4px 4px 4px 14px;align-items:center}
.field:focus-within{border-color:var(--pine)}
.field input{flex:1;border:0;background:transparent;padding:12px 0;font-size:17px;min-width:0;outline:none}
.icon-btn{border:0;background:transparent;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.icon-btn:active{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}
.check-row{display:flex;gap:10px;align-items:center;margin:14px 2px 22px;color:var(--ink-2);font-size:15px}
.check-row input{width:20px;height:20px;accent-color:var(--pine)}
.btn-primary{width:100%;border:0;border-radius:var(--radius);background:var(--pine);color:var(--pine-ink);font-weight:700;font-size:17px;padding:15px;cursor:pointer}
.btn-primary:disabled{opacity:.6}
.lock .error{color:var(--rust);margin:14px 2px 0;font-size:15px;min-height:1.4em}

/* ---------- App shell ---------- */
.app{max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.updated{font-size:13px;color:var(--ink-3)}
.top-actions{display:flex;gap:2px}

.hero{margin:10px 0 18px}
.hero .weekday{font-family:var(--font-display);font-weight:500;font-size:20px;color:var(--ink-2);margin:0}
.hero .date{font-family:var(--font-display);font-weight:800;font-size:52px;line-height:.95;letter-spacing:-.03em;margin:0}
.hero .summary{margin:10px 0 0;color:var(--ink-2);font-size:16px}

/* Day strip — the one bold element */
.strip{display:grid;grid-template-columns:repeat(14,minmax(38px,1fr));gap:6px;overflow-x:auto;scrollbar-width:none;
  margin:0 -16px;padding:4px 16px 8px;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.day{scroll-snap-align:start;border:0;background:var(--surface);border-radius:16px;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-height:76px;position:relative}
.day .wd{font-size:12px;color:var(--ink-3)}
.day .dn{font-family:var(--font-display);font-weight:700;font-size:20px;line-height:1.1}
.day .dots{display:flex;gap:3px;height:8px;margin-top:4px}
.day .dots i{width:7px;height:7px;border-radius:50%;display:block}
.dot-entrega{background:var(--ochre)} .dot-op{background:var(--pine)} .dot-ev{background:var(--sky)}
.day.today{background:var(--ink);color:var(--bg)}
.day.today .wd{color:inherit;opacity:.75}
.day.weekend:not(.today){background:var(--surface-2)}
.day[aria-pressed="true"]:not(.today){outline:2px solid var(--ink)}
.day-detail{background:var(--surface);border-radius:var(--radius);padding:12px 14px;margin:4px 0 0;font-size:15px}
.day-detail h3{font-family:var(--font-display);font-size:16px;margin:0 0 6px}
.day-detail ul{margin:0;padding-left:18px}
.day-detail p{margin:0;color:var(--ink-2)}

/* Sections */
.section{margin:28px 0 0}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 2px 10px}
.section h2{font-family:var(--font-display);font-weight:700;font-size:23px;letter-spacing:-.01em;margin:0}
.section .count{color:var(--ink-3);font-size:14px}
.list{display:flex;flex-direction:column;gap:8px}

.item{background:var(--surface);border-radius:var(--radius);padding:14px 14px 13px;display:grid;grid-template-columns:1fr;gap:4px;position:relative}
.item.with-check{grid-template-columns:auto 1fr;column-gap:12px}
.item-title{font-weight:700;font-size:16.5px;line-height:1.3;margin:0}
.item-title a{color:inherit;text-decoration:none}
.item-title a:hover{text-decoration:underline}
.item-meta{font-size:14px;color:var(--ink-2)}
.item-body{font-size:15px;color:var(--ink-2);margin:2px 0 0}
.item-body strong{color:var(--ink)}
.item-link{font-size:14px;font-weight:700;text-decoration:none;margin-top:4px;justify-self:start}

.chip{display:inline-block;font-size:13px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.soon{background:var(--ochre-soft);color:var(--ochre)}
.chip.late{background:var(--rust-soft);color:var(--rust)}
.chip.today-c{background:var(--ink);color:var(--bg)}
.chip.good{background:var(--pine);color:var(--pine-ink)}
.chip.sky{background:var(--sky-soft);color:var(--sky)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Custom checkbox */
.tick{appearance:none;-webkit-appearance:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--ink-3);margin:1px 0 0;cursor:pointer;display:grid;place-items:center;background:transparent}
.tick:checked{background:var(--pine);border-color:var(--pine)}
.tick:checked::after{content:"";width:12px;height:7px;border-left:3px solid var(--pine-ink);border-bottom:3px solid var(--pine-ink);transform:translateY(-2px) rotate(-45deg)}
.item.done .item-title{text-decoration:line-through;color:var(--ink-3)}
.item.done{background:transparent;border:1.5px dashed var(--line)}

/* Action buttons */
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.act{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-size:14.5px;font-weight:700;cursor:pointer;color:var(--ink-2)}
.act[aria-pressed="true"].yes{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.act[aria-pressed="true"].no{background:var(--surface-2);color:var(--ink-3)}
.act:active{transform:scale(.97)}
.item.interested{box-shadow:inset 4px 0 0 var(--pine)}
.item.saved{box-shadow:inset 4px 0 0 var(--ochre)}

.why{font-size:14.5px;margin-top:6px;color:var(--ink-2)}
.missing{font-size:14.5px;margin-top:6px;padding:8px 10px;border-radius:var(--radius-sm);background:var(--ochre-soft);color:var(--ink)}

details.folded{margin-top:8px}
details.folded summary{cursor:pointer;color:var(--ink-3);font-size:14.5px;padding:8px 2px;list-style:none}
details.folded summary::-webkit-details-marker{display:none}
details.folded summary::before{content:"+ "}
details[open].folded summary::before{content:"− "}
details.folded .list{opacity:.75}

.segmented{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;margin:6px 0 0}
.segmented button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-size:14.5px;font-weight:700;color:var(--ink-2);cursor:pointer}
.segmented button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}

.empty{background:var(--surface);border-radius:var(--radius-lg);padding:26px 20px;text-align:left}
.empty h3{font-family:var(--font-display);font-size:22px;margin:0 0 4px}
.empty p{margin:0;color:var(--ink-2)}
.note{font-size:14px;color:var(--ink-3);margin:30px 2px 0}

/* Bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:8px 16px calc(8px + env(safe-area-inset-bottom))}
.tabs-inner{max-width:420px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tab{border:0;background:transparent;border-radius:16px;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:14px;color:var(--ink-3);cursor:pointer;position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--ink);background:var(--surface)}
.tab .badge{position:absolute;top:5px;right:calc(50% - 26px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--rust);color:#fff;font-size:11px;display:grid;place-items:center}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

@media (prefers-reduced-motion: no-preference){
  .hero .date{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
  .strip .day{animation:rise .45s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i) * 25ms + 80ms)}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
}
@media (min-width:600px){ .hero .date{font-size:64px} }
</style>
</head>
<body>

<!-- Lock screen -->
<main id="lock" class="lock hidden" aria-labelledby="lock-title">
  <form class="lock-card" id="lock-form" autocomplete="off">
    <h1 id="lock-title">Hub</h1>
    <p>Escribe tu clave para abrir tu tablón.</p>
    <label for="pass" class="hidden">Clave</label>
    <div class="field">
      <input id="pass" type="password" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="palabra-palabra-…-00" required>
      <button type="button" class="icon-btn" id="toggle-pass" aria-label="Mostrar la clave">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <label class="check-row"><input type="checkbox" id="remember" checked> Recordar en este móvil</label>
    <button class="btn-primary" id="unlock-btn" type="submit">Desbloquear</button>
    <p class="error" id="lock-error" role="alert"></p>
  </form>
</main>

<!-- App -->
<div id="app" class="app hidden">
  <header class="topbar">
    <span class="updated" id="updated"></span>
    <div class="top-actions">
      <button class="icon-btn" id="refresh" aria-label="Actualizar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button class="icon-btn" id="theme" aria-label="Cambiar tema claro u oscuro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="icon-btn" id="lock-btn" aria-label="Bloquear y olvidar la clave en este móvil">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </button>
    </div>
  </header>

  <section id="view-hoy" role="tabpanel" aria-labelledby="tab-hoy"></section>
  <section id="view-empleo" role="tabpanel" aria-labelledby="tab-empleo" class="hidden"></section>
</div>

<nav class="tabs hidden" id="tabs" role="tablist" aria-label="Secciones">
  <div class="tabs-inner">
    <button class="tab" role="tab" id="tab-hoy" aria-selected="true" aria-controls="view-hoy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      Hoy<span class="badge hidden" id="badge-hoy"></span>
    </button>
    <button class="tab" role="tab" id="tab-empleo" aria-selected="false" aria-controls="view-empleo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg>
      Empleo<span class="badge hidden" id="badge-empleo"></span>
    </button>
  </div>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
"use strict";

/* ===== Storage helpers (all wrapped: storage can fail) ===== */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const KEY_STORE = "hub.key";      // {salt, raw} cached AES key
const STATE_STORE = "hub.state";  // user marks
let state = Object.assign({done:{}, interest:{}, saved:{}, hidden:{}, seen:{}}, store.get(STATE_STORE, {}));
const saveState = () => store.set(STATE_STORE, state);

/* ===== Theme ===== */
const themeSaved = store.get("hub.theme", null);
if (themeSaved) document.documentElement.dataset.theme = themeSaved;
document.getElementById("theme").addEventListener("click", () => {
  const cur = document.documentElement.dataset.theme ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  store.set("hub.theme", next);
});

/* ===== Crypto (AES-GCM, PBKDF2-SHA256) ===== */
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
async function deriveKey(pass, salt, iter){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", hash:"SHA-256", salt, iterations:iter}, base,
    {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
async function decryptEnv(env, key){
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(env.iv)}, key, b64d(env.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function cachedKey(env){
  const c = store.get(KEY_STORE, null);
  if (!c || c.salt !== env.salt) return null;
  try{ return await crypto.subtle.importKey("raw", b64d(c.raw), "AES-GCM", false, ["decrypt"]); }catch(e){ return null; }
}

/* ===== Data loading ===== */
let env = null, data = null;
async function fetchEnv(){
  const r = await fetch("data.enc.json?t=" + Date.now(), {cache:"no-store"});
  if (!r.ok) throw new Error("http " + r.status);
  return r.json();
}

const $ = id => document.getElementById(id);
function showLock(msg){
  $("lock").classList.remove("hidden");
  $("app").classList.add("hidden"); $("tabs").classList.add("hidden");
  $("lock-error").textContent = msg || "";
  setTimeout(() => $("pass").focus(), 50);
}
function showApp(){
  $("lock").classList.add("hidden");
  $("app").classList.remove("hidden"); $("tabs").classList.remove("hidden");
  render();
}

async function boot(){
  try{ env = await fetchEnv(); }
  catch(e){ showLock("No se ha podido cargar el archivo de datos. Revisa la conexión y vuelve a abrir la app."); return; }
  const key = await cachedKey(env);
  if (key){
    try{ data = await decryptEnv(env, key); showApp(); return; }
    catch(e){ store.del(KEY_STORE); }
  }
  showLock();
}

$("toggle-pass").addEventListener("click", () => {
  const i = $("pass"); const show = i.type === "password";
  i.type = show ? "text" : "password";
  $("toggle-pass").setAttribute("aria-label", show ? "Ocultar la clave" : "Mostrar la clave");
});

$("lock-form").addEventListener("submit", async ev => {
  ev.preventDefault();
  const pass = $("pass").value.trim().toLowerCase();
  if (!pass) return;
  if (!env){ try{ env = await fetchEnv(); }catch(e){ $("lock-error").textContent = "Sin conexión: no se pueden cargar los datos."; return; } }
  const btn = $("unlock-btn"); btn.disabled = true; btn.textContent = "Abriendo…"; $("lock-error").textContent = "";
  try{
    const key = await deriveKey(pass, b64d(env.salt), env.iter || 600000);
    data = await decryptEnv(env, key);
    if ($("remember").checked){
      store.set(KEY_STORE, {salt: env.salt, raw: b64e(await crypto.subtle.exportKey("raw", key))});
    }
    $("pass").value = "";
    showApp();
  }catch(e){
    $("lock-error").textContent = "Clave incorrecta. Revisa los guiones y vuelve a probar.";
  }finally{
    btn.disabled = false; btn.textContent = "Desbloquear";
  }
});

$("lock-btn").addEventListener("click", () => {
  store.del(KEY_STORE); data = null; showLock("App bloqueada. Tendrás que escribir la clave otra vez.");
});

async function refresh(silent){
  try{
    const fresh = await fetchEnv();
    if (silent && env && fresh.iv === env.iv) return;
    const key = await cachedKey(fresh);
    if (!key){ env = fresh; showLock("Escribe la clave para cargar los datos nuevos."); return; }
    env = fresh; data = await decryptEnv(env, key); render(); if (!silent) toast("Actualizado");
  }catch(e){ if (!silent) toast("No se ha podido actualizar"); }
}
$("refresh").addEventListener("click", () => refresh(false));

/* ===== Dates ===== */
const TZ = "Europe/Madrid";
const pad = n => String(n).padStart(2, "0");
function todayISO(){
  const p = new Intl.DateTimeFormat("en-CA", {timeZone:TZ, year:"numeric", month:"2-digit", day:"2-digit"}).format(new Date());
  return p; // YYYY-MM-DD
}
function isoToDate(iso){ const [y,m,d] = iso.slice(0,10).split("-").map(Number); return new Date(Date.UTC(y, m-1, d)); }
function addDays(iso, n){ const d = isoToDate(iso); d.setUTCDate(d.getUTCDate()+n); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; }
function diffDays(a, b){ return Math.round((isoToDate(a) - isoToDate(b)) / 864e5); }
const fmtLong = new Intl.DateTimeFormat("es-ES", {day:"numeric", month:"long", timeZone:"UTC"});
const fmtShort = new Intl.DateTimeFormat("es-ES", {weekday:"short", day:"numeric", month:"short", timeZone:"UTC"});
const fmtWd = new Intl.DateTimeFormat("es-ES", {weekday:"long", timeZone:"UTC"});
const fmtWd1 = new Intl.DateTimeFormat("es-ES", {weekday:"narrow", timeZone:"UTC"});
function shortDate(iso){ return fmtShort.format(isoToDate(iso)).replace(/\./g, ""); }
function relDay(iso){
  const n = diffDays(iso, todayISO());
  if (n === 0) return {t:"hoy", c:"today-c"};
  if (n === 1) return {t:"mañana", c:"soon"};
  if (n > 1 && n <= 7) return {t:`en ${n} días`, c:"soon"};
  if (n > 7) return {t:shortDate(iso), c:""};
  if (n === -1) return {t:"ayer", c:"late"};
  return {t:`hace ${-n} días`, c:"late"};
}
function ago(ts){
  if (!ts) return "";
  const m = Math.round((Date.now() - new Date(ts)) / 6e4);
  if (m < 2) return "Actualizado ahora";
  if (m < 60) return `Actualizado hace ${m} min`;
  const h = Math.round(m/60);
  if (h < 24) return `Actualizado hace ${h} h`;
  const d = Math.round(h/24);
  return `Actualizado hace ${d} ${d === 1 ? "día" : "días"}`;
}

/* ===== Rendering helpers ===== */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => { try{ const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ""; }catch(e){ return ""; } };
function titleHTML(text, url){
  const u = safeUrl(url);
  return u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(text)}</a>` : esc(text);
}
function chip(rel){ return `<span class="chip ${rel.c}">${esc(rel.t)}</span>`; }
// Chip + date, without repeating the date when the chip already shows it
function when(iso, extra){
  const r = relDay(iso), sd = shortDate(iso);
  const tail = [r.t === sd ? "" : sd, extra || ""].filter(Boolean).join(", ");
  return chip(r) + (tail ? `<span class="item-meta">${esc(tail)}</span>` : "");
}
function section(id, title, inner, count){
  if (!inner) return "";
  return `<div class="section" id="${id}"><div class="section-head"><h2>${esc(title)}</h2>${count != null ? `<span class="count">${count}</span>` : ""}</div>${inner}</div>`;
}
let toastTimer;
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1600); }

/* ===== HOY ===== */
let selectedDay = null;
function renderHoy(){
  const h = (data && data.hoy) || {};
  const today = todayISO();
  const entregas = (h.entregas || []).slice().sort((a,b) => (a.fecha||"").localeCompare(b.fecha||""));
  const ops = (h.oportunidades || []).slice().sort((a,b) => (a.fecha||"9").localeCompare(b.fecha||"9"));
  const eventos = (h.eventos || []).slice().sort((a,b) => (a.inicio||"").localeCompare(b.inicio||""));
  const correos = h.correos || [], cambios = h.cambios || [], avisos = h.avisos || [];

  const pending = entregas.filter(e => !state.done[e.id]);
  const soonCount = pending.filter(e => { const n = diffDays(e.fecha, today); return n >= 0 && n <= 7; }).length;
  const d = isoToDate(today);
  let summaryBits = [];
  if (soonCount) summaryBits.push(`${soonCount} ${soonCount === 1 ? "fecha límite" : "fechas límite"} esta semana`);
  if (correos.length) summaryBits.push(`${correos.length} ${correos.length === 1 ? "correo espera" : "correos esperan"} respuesta`);
  const summary = summaryBits.length ? summaryBits.join(" y ") + "." : "Sin prisas por ahora.";

  // Day strip
  const byDay = {};
  const mark = (iso, kind, label) => { if (!iso) return; const k = iso.slice(0,10); (byDay[k] = byDay[k] || []).push({kind, label}); };
  entregas.forEach(e => { if (!state.done[e.id]) mark(e.fecha, "entrega", e.titulo); });
  ops.forEach(o => { if (state.interest[o.id] !== "no") mark(o.fecha, "op", o.titulo); });
  eventos.forEach(e => mark(e.inicio, "ev", e.titulo));
  let strip = "";
  for (let i = 0; i < 14; i++){
    const iso = addDays(today, i), dt = isoToDate(iso), wd = dt.getUTCDay();
    const items = byDay[iso] || [];
    const kinds = [...new Set(items.map(x => x.kind))];
    const dots = kinds.map(k => `<i class="dot-${k === "entrega" ? "entrega" : k === "op" ? "op" : "ev"}"></i>`).join("");
    const label = `${fmtWd.format(dt)} ${dt.getUTCDate()}${items.length ? `, ${items.length} ${items.length === 1 ? "cosa" : "cosas"}` : ""}`;
    strip += `<button class="day${i === 0 ? " today" : ""}${wd === 0 || wd === 6 ? " weekend" : ""}" style="--i:${i}" data-day="${iso}" aria-pressed="${selectedDay === iso}" aria-label="${esc(label)}">
      <span class="wd">${i === 0 ? "hoy" : esc(fmtWd1.format(dt))}</span><span class="dn">${dt.getUTCDate()}</span><span class="dots">${dots}</span></button>`;
  }
  let detail = "";
  if (selectedDay){
    const items = byDay[selectedDay] || [];
    const name = fmtShort.format(isoToDate(selectedDay)).replace(/\./g, "");
    detail = `<div class="day-detail"><h3>${esc(name)}</h3>${items.length ? `<ul>${items.map(x => `<li>${esc(x.label)}</li>`).join("")}</ul>` : `<p>Día libre de entregas y eventos.</p>`}</div>`;
  }

  // Entregas
  const entHTML = entregas.length ? `<div class="list">${
    [...pending, ...entregas.filter(e => state.done[e.id])].map(e => {
      const done = !!state.done[e.id];
      const meta = [e.asignatura, e.hora].filter(Boolean).map(esc).join(", ");
      return `<article class="item with-check${done ? " done" : ""}">
        <input type="checkbox" class="tick" data-done="${esc(e.id)}" ${done ? "checked" : ""} aria-label="Marcar como hecha: ${esc(e.titulo)}">
        <div>
          <div class="row">${when(e.fecha)}</div>
          <p class="item-title" style="margin-top:6px">${titleHTML(e.titulo, e.enlace)}</p>
          ${meta ? `<div class="item-meta">${meta}</div>` : ""}
          ${e.detalle ? `<p class="item-body">${esc(e.detalle)}</p>` : ""}
        </div></article>`;
    }).join("")}</div>` : "";

  // Correos
  const corHTML = correos.length ? `<div class="list">${correos.map(c => `
    <article class="item">
      <div class="row"><span class="chip sky">${esc(c.de)}</span><span class="item-meta">${c.fecha ? esc(shortDate(c.fecha)) : ""}</span></div>
      <p class="item-title" style="margin-top:6px">${titleHTML(c.asunto, c.enlace)}</p>
      ${c.resumen ? `<p class="item-body">${esc(c.resumen)}</p>` : ""}
    </article>`).join("")}</div>` : "";

  // Oportunidades
  const opItem = o => {
    const v = state.interest[o.id];
    const meta = [o.tipo, o.lugar].filter(Boolean).map(esc).join(", ");
    return `<article class="item${v === "si" ? " interested" : ""}">
      <div class="row">${o.fecha ? chip(relDay(o.fecha)) : `<span class="chip">sin fecha</span>`}${meta ? `<span class="item-meta">${meta}</span>` : ""}</div>
      <p class="item-title" style="margin-top:6px">${titleHTML(o.titulo, o.enlace)}</p>
      ${o.detalle ? `<p class="item-body">${esc(o.detalle)}</p>` : ""}
      <div class="actions">
        <button class="act yes" data-int="${esc(o.id)}" data-v="si" aria-pressed="${v === "si"}">Me interesa</button>
        <button class="act no" data-int="${esc(o.id)}" data-v="no" aria-pressed="${v === "no"}">No me interesa</button>
      </div></article>`;
  };
  const opsOn = ops.filter(o => state.interest[o.id] !== "no"), opsOff = ops.filter(o => state.interest[o.id] === "no");
  const opHTML = ops.length ? `<div class="list">${opsOn.map(opItem).join("")}</div>${opsOff.length ? `<details class="folded"><summary>Descartadas (${opsOff.length})</summary><div class="list">${opsOff.map(opItem).join("")}</div></details>` : ""}` : "";

  const simple = arr => arr.length ? `<div class="list">${arr.map(a => `
    <article class="item">
      ${a.fecha ? `<div class="row"><span class="item-meta">${esc(shortDate(a.fecha))}</span></div>` : ""}
      <p class="item-title">${titleHTML(a.titulo, a.enlace)}</p>
      ${(a.resumen || a.detalle) ? `<p class="item-body">${esc(a.resumen || a.detalle)}</p>` : ""}
    </article>`).join("")}</div>` : "";

  const evHTML = eventos.length ? `<div class="list">${eventos.map(e => `
    <article class="item">
      <div class="row">${when(e.inicio, e.hora)}</div>
      <p class="item-title" style="margin-top:6px">${esc(e.titulo)}</p>
      ${e.lugar ? `<div class="item-meta">${esc(e.lugar)}</div>` : ""}
    </article>`).join("")}</div>` : "";

  const body = section("s-entregas", "Entregas y fechas límite", entHTML, pending.length ? `${pending.length} pendientes` : null)
    + section("s-correos", "Por responder", corHTML)
    + section("s-cambios", "Cambios de aula y prácticas", simple(cambios))
    + section("s-ops", "Oportunidades", opHTML)
    + section("s-avisos", "Avisos", simple(avisos))
    + section("s-eventos", "En tu calendario", evHTML);

  $("view-hoy").innerHTML = `
    <div class="hero">
      <p class="weekday">${esc(fmtWd.format(d))}</p>
      <h1 class="date">${esc(fmtLong.format(d))}</h1>
      <p class="summary">${esc(summary)}</p>
    </div>
    <div class="strip" role="group" aria-label="Próximos 14 días">${strip}</div>
    ${detail}
    ${body || `<div class="section"><div class="empty"><h3>Todo en orden</h3><p>No hay entregas, avisos ni correos pendientes. Mañana a las 8:00 se vuelve a revisar.</p></div></div>`}
    <p class="note">Se actualiza cada día a las 8:00. Lo que marcas se guarda solo en este móvil.</p>`;

  const badge = pending.filter(e => diffDays(e.fecha, today) <= 2).length + correos.length;
  $("badge-hoy").textContent = badge; $("badge-hoy").classList.toggle("hidden", !badge);
}

/* ===== EMPLEO ===== */
let empleoFilter = "todas";
function renderEmpleo(){
  const e = (data && data.empleo) || {};
  const cands = e.candidaturas || [];
  const ofertas = (e.ofertas || []).slice().sort((a,b) => (a.prioridad||9) - (b.prioridad||9));
  const quizas = (e.quizas || []).slice().sort((a,b) => (a.prioridad||9) - (b.prioridad||9));

  const jobItem = (j, maybe) => {
    const saved = !!state.saved[j.id], hid = !!state.hidden[j.id];
    const meta = [j.ubicacion, j.modalidad, j.nivel].filter(Boolean).map(esc).join(", ");
    return `<article class="item${saved ? " saved" : ""}">
      <div class="row">${j.empresa ? `<span class="chip">${esc(j.empresa)}</span>` : ""}${j.area ? `<span class="item-meta">${esc(j.area)}</span>` : ""}</div>
      <p class="item-title" style="margin-top:6px">${titleHTML(j.puesto, j.enlace)}</p>
      ${meta ? `<div class="item-meta">${meta}</div>` : ""}
      ${j.porque ? `<p class="why">${esc(j.porque)}</p>` : ""}
      ${maybe && j.falta ? `<p class="missing"><strong>Falta:</strong> ${esc(j.falta)}</p>` : ""}
      <div class="actions">
        <button class="act yes" data-save="${esc(j.id)}" aria-pressed="${saved}">${saved ? "Guardada" : "Guardar"}</button>
        <button class="act no" data-hide="${esc(j.id)}" aria-pressed="${hid}">${hid ? "Mostrar" : "Ocultar"}</button>
      </div></article>`;
  };
  const group = (arr, maybe) => {
    let vis = arr.filter(j => !state.hidden[j.id]);
    if (empleoFilter === "guardadas") vis = vis.filter(j => state.saved[j.id]);
    const off = arr.filter(j => state.hidden[j.id]);
    if (!vis.length && !off.length) return "";
    return `${vis.length ? `<div class="list">${vis.map(j => jobItem(j, maybe)).join("")}</div>` : `<p class="item-meta" style="margin:0 2px">Nada guardado aquí.</p>`}
      ${off.length && empleoFilter === "todas" ? `<details class="folded"><summary>Ocultas (${off.length})</summary><div class="list">${off.map(j => jobItem(j, maybe)).join("")}</div></details>` : ""}`;
  };

  const candHTML = cands.length ? `<div class="list">${cands.map(c => `
    <article class="item">
      <div class="row"><span class="chip ${/rechaz|descart/i.test(c.estado||"") ? "late" : /entrevista|avanz|seleccion/i.test(c.estado||"") ? "good" : "sky"}">${esc(c.estado || "Actualización")}</span><span class="item-meta">${c.fecha ? esc(shortDate(c.fecha)) : ""}</span></div>
      <p class="item-title" style="margin-top:6px">${titleHTML(`${c.puesto || ""}${c.empresa ? " · " + c.empresa : ""}`.replace(/^ · /, ""), c.enlace)}</p>
      ${c.detalle ? `<p class="item-body">${esc(c.detalle)}</p>` : ""}
    </article>`).join("")}</div>` : "";

  const ofHTML = group(ofertas, false), qzHTML = group(quizas, true);
  const savedCount = [...ofertas, ...quizas].filter(j => state.saved[j.id]).length;
  const upd = e.updated ? `Revisado el ${esc(shortDate(e.updated))}` : "";

  $("view-empleo").innerHTML = `
    <div class="hero">
      <p class="weekday">Empleo</p>
      <h1 class="date">${ofertas.length} ${ofertas.length === 1 ? "oferta" : "ofertas"}</h1>
      <p class="summary">Becas y prácticas en Murcia y el resto de España. ${upd ? upd + "." : ""}</p>
      <div class="segmented" role="group" aria-label="Filtrar ofertas">
        <button data-filter="todas" aria-pressed="${empleoFilter === "todas"}">Todas</button>
        <button data-filter="guardadas" aria-pressed="${empleoFilter === "guardadas"}">Guardadas (${savedCount})</button>
      </div>
    </div>
    ${section("s-cand", "Tus candidaturas", candHTML)}
    ${section("s-of", "Encajan contigo", ofHTML)}
    ${section("s-qz", "Quizás", qzHTML)}
    ${(!candHTML && !ofHTML && !qzHTML) ? `<div class="section"><div class="empty"><h3>Sin ofertas esta semana</h3><p>El lunes se vuelven a revisar LinkedIn y las demás plataformas.</p></div></div>` : ""}
    <p class="note">Se actualiza cada lunes. Las ofertas se quedan visibles dos semanas.</p>`;

  const fresh = ofertas.filter(j => !state.seen[j.id] && !state.hidden[j.id]).length + cands.filter(c => !state.seen[c.id]).length;
  $("badge-empleo").textContent = fresh; $("badge-empleo").classList.toggle("hidden", !fresh);
}

function render(){
  $("updated").textContent = ago(data && data.updated);
  renderHoy(); renderEmpleo();
}

/* ===== Events (delegated) ===== */
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.done){
    if (t.checked) state.done[t.dataset.done] = Date.now(); else delete state.done[t.dataset.done];
    saveState(); renderHoy(); if (t.checked) toast("Marcada como hecha");
  }
});
document.addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  if (b.dataset.day){ selectedDay = selectedDay === b.dataset.day ? null : b.dataset.day; renderHoy(); return; }
  if (b.dataset.int){
    const id = b.dataset.int, v = b.dataset.v;
    if (state.interest[id] === v) delete state.interest[id]; else state.interest[id] = v;
    saveState(); renderHoy(); return;
  }
  if (b.dataset.save){
    const id = b.dataset.save; if (state.saved[id]) delete state.saved[id]; else { state.saved[id] = Date.now(); toast("Guardada"); }
    saveState(); renderEmpleo(); return;
  }
  if (b.dataset.hide){
    const id = b.dataset.hide; if (state.hidden[id]) delete state.hidden[id]; else { state.hidden[id] = Date.now(); toast("Oculta"); }
    saveState(); renderEmpleo(); return;
  }
  if (b.dataset.filter){ empleoFilter = b.dataset.filter; renderEmpleo(); return; }
});

function selectTab(name){
  const isHoy = name === "hoy";
  $("tab-hoy").setAttribute("aria-selected", isHoy); $("tab-empleo").setAttribute("aria-selected", !isHoy);
  $("view-hoy").classList.toggle("hidden", !isHoy); $("view-empleo").classList.toggle("hidden", isHoy);
  if (!isHoy && data && data.empleo){
    [...(data.empleo.ofertas||[]), ...(data.empleo.candidaturas||[])].forEach(j => state.seen[j.id] = 1);
    saveState(); setTimeout(() => { $("badge-empleo").classList.add("hidden"); }, 300);
  }
  scrollTo({top:0});
  if (location.hash !== "#" + name) history.replaceState(null, "", "#" + name);
}
$("tab-hoy").addEventListener("click", () => selectTab("hoy"));
$("tab-empleo").addEventListener("click", () => selectTab("empleo"));
if (location.hash === "#empleo") setTimeout(() => selectTab("empleo"), 0);

// Refresh data when coming back to the app
document.addEventListener("visibilitychange", () => { if (!document.hidden && data) refresh(true); });

// Housekeeping: forget marks older than 60 days
(function prune(){
  const limit = Date.now() - 60*864e5;
  for (const k of ["done","saved","hidden"]) for (const id in state[k]) if (typeof state[k][id] === "number" && state[k][id] < limit && state[k][id] > 1) delete state[k][id];
  saveState();
})();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
boot();
})();
</script>
</body>
