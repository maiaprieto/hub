<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hub</title>
<meta name="description" content="Tablón personal de Maia: universidad y empleo">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F6F7F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101513" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hub">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7F4; --surface:#FFFFFF; --sunk:#EDF0EA; --ink:#1D2420; --ink-2:#47524C; --ink-3:#5F6B64;
  --line:#E2E6DF; --pine:#1F6F5C; --pine-ink:#FFFFFF; --pine-soft:#DDEFE8;
  --ochre:#9A5B0B; --ochre-soft:#FBEBD0; --rust:#B0402A; --rust-soft:#FADDD5;
  --shadow:0 1px 2px rgba(29,36,32,.06), 0 6px 18px rgba(29,36,32,.08);
  --shadow-lift:0 2px 6px rgba(29,36,32,.08), 0 14px 34px rgba(29,36,32,.14);
  --r-xl:26px; --r-lg:20px; --r:14px;
  --display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", ui-sans-serif, system-ui, sans-serif;
  --cover-filter:none;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101513; --surface:#18201C; --sunk:#1F2925; --ink:#E6EDE8; --ink-2:#AEBDB4; --ink-3:#8D9C93;
    --line:#2A3631; --pine:#5CC3A6; --pine-ink:#0B1A15; --pine-soft:#183A31;
    --ochre:#F0BE62; --ochre-soft:#3A2D18; --rust:#F08D74; --rust-soft:#3D231D;
    --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lift:0 8px 28px rgba(0,0,0,.5);
    --cover-filter:brightness(.82) saturate(.92); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101513; --surface:#18201C; --sunk:#1F2925; --ink:#E6EDE8; --ink-2:#AEBDB4; --ink-3:#8D9C93;
  --line:#2A3631; --pine:#5CC3A6; --pine-ink:#0B1A15; --pine-soft:#183A31;
  --ochre:#F0BE62; --ochre-soft:#3A2D18; --rust:#F08D74; --rust-soft:#3D231D;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lift:0 8px 28px rgba(0,0,0,.5);
  --cover-filter:brightness(.82) saturate(.92); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100dvh;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--pine);outline-offset:2px;border-radius:8px}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:22px;height:22px;flex:none}

/* ---------- Lock ---------- */
.lock{min-height:100dvh;display:grid;place-items:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom))}
.lock-card{width:100%;max-width:380px}
.lock-art{height:170px;border-radius:var(--r-xl);overflow:hidden;margin-bottom:26px;box-shadow:var(--shadow)}
.lock h1{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;letter-spacing:-.02em;margin:0 0 6px}
.lock p{color:var(--ink-2);margin:0 0 22px}
.field{display:flex;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:4px 4px 4px 14px;align-items:center}
.field:focus-within{border-color:var(--pine)}
.field input{flex:1;border:0;background:transparent;padding:12px 0;font-size:17px;min-width:0;outline:none}
.check-row{display:flex;gap:10px;align-items:center;margin:14px 2px 20px;color:var(--ink-2);font-size:15px}
.check-row input{width:20px;height:20px;accent-color:var(--pine)}
.btn{border:0;border-radius:var(--r);font-weight:700;font-size:16.5px;padding:14px 18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;min-height:52px}
.btn-primary{background:var(--pine);color:var(--pine-ink)}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn-wide{width:100%}
.btn:disabled{opacity:.6}
.btn:active{transform:scale(.98)}
.error{color:var(--rust);margin:14px 2px 0;font-size:15px;min-height:1.4em}
.icon-btn{border:0;background:transparent;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.icon-btn:active{background:var(--sunk)}

/* ---------- Shell ---------- */
.page{max-width:620px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 20px calc(110px + env(safe-area-inset-bottom))}
.page.detail{padding:0 0 calc(120px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;min-height:52px}
.top .tools{display:flex;margin-right:-10px}
.eyebrow{font-size:15px;color:var(--ink-3);margin:0}
.greet{font-family:var(--display);font-weight:800;font-size:38px;line-height:1.02;letter-spacing:-.025em;margin:2px 0 4px}
.lede{color:var(--ink-2);margin:0;font-size:16.5px}
.h2{font-family:var(--display);font-weight:650;font-size:22px;letter-spacing:-.01em;margin:0}
.sec{margin-top:30px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.link-btn{border:0;background:none;color:var(--ink);font-weight:700;font-size:15px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px 0;display:inline-block}
.stale{background:var(--rust-soft);border-radius:var(--r);padding:12px 14px;font-size:15px;margin:8px 0 0}

/* Cover art (the signature element) */
.cover{position:relative;overflow:hidden;background:var(--sunk)}
.cover svg{display:block;width:100%;height:100%;filter:var(--cover-filter)}

/* Focus card */
.focus{display:block;margin-top:22px;border-radius:var(--r-xl);overflow:hidden;background:var(--surface);box-shadow:var(--shadow-lift);text-decoration:none;color:inherit}
.focus .cover{aspect-ratio:16/9}
.focus-body{padding:16px 18px 18px}
.focus-kicker{font-size:14.5px;color:var(--ink-2);margin-bottom:6px}
.focus h2{font-family:var(--display);font-weight:650;font-size:24px;line-height:1.15;letter-spacing:-.01em;margin:0}
.pill{position:absolute;left:14px;top:14px;background:var(--surface);color:var(--ink);font-weight:700;font-size:14px;padding:6px 12px;border-radius:999px;box-shadow:var(--shadow)}
.pill.urgent{background:var(--ink);color:var(--bg)}

/* Category tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;position:relative;text-decoration:none;color:inherit}
.tile .cover{height:74px}
.tile-body{padding:10px 14px 13px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.tile-name{font-weight:700;font-size:15.5px;line-height:1.2}
.tile-num{font-family:var(--display);font-weight:800;font-size:26px;line-height:1}
.tile.empty-t .tile-num,.tile.empty-t .tile-name{color:var(--ink-3)}
.tile .newdot{position:absolute;right:10px;top:10px;box-shadow:0 0 0 3px var(--surface)}

/* Rows (names only) */
.rows{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:12px 14px;width:100%;min-height:70px;color:inherit;text-decoration:none}
.row + .row{border-top:1px solid var(--line)}
.row:active{background:var(--sunk)}
.thumb{width:46px;height:46px;border-radius:12px;overflow:hidden;flex:none}
.row-main{flex:1;min-width:0}
.row-title{font-weight:700;font-size:16px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row-sub{font-size:14px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.when{font-size:14px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.when.soon{color:var(--ochre)} .when.late{color:var(--rust)} .when.now{color:var(--pine)}
.row.done .row-title{text-decoration:line-through;color:var(--ink-3)}
.newdot{width:9px;height:9px;border-radius:50%;background:var(--rust);display:inline-block;flex:none}
.group-label{font-size:15px;color:var(--ink-3);margin:22px 4px 8px}
.chev{color:var(--ink-3);display:flex}

/* List page header */
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;font-weight:700;font-size:16px;padding:10px 8px 10px 0;cursor:pointer;color:var(--ink);text-decoration:none}
.page-title{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.05;letter-spacing:-.02em;margin:6px 0 2px}

/* Detail page */
.hero{position:relative;height:min(44vh,320px)}
.hero .cover{position:absolute;inset:0}
.hero-btn{position:absolute;top:calc(12px + env(safe-area-inset-top));width:42px;height:42px;border-radius:50%;background:var(--surface);border:0;display:grid;place-items:center;box-shadow:var(--shadow);cursor:pointer;color:var(--ink)}
.hero-btn.l{left:16px} .hero-btn.r{right:16px}
.hero-btn[aria-pressed="true"]{color:var(--rust)}
.sheet{position:relative;margin-top:-26px;background:var(--bg);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:26px 22px 0}
.kind{font-size:15px;color:var(--ink-3);margin:0 0 6px}
.d-title{font-family:var(--display);font-weight:800;font-size:31px;line-height:1.08;letter-spacing:-.02em;margin:0}
.facts{margin:22px 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.facts li{display:flex;gap:14px;align-items:flex-start;padding:15px 0;border-bottom:1px solid var(--line)}
.facts .i{color:var(--ink-2);margin-top:1px}
.fact-k{font-size:14px;color:var(--ink-3)}
.fact-v{font-weight:700;font-size:16.5px}
.prose{font-size:17px;line-height:1.6;color:var(--ink);margin:22px 0 0;max-width:62ch}
.note-box{border-radius:var(--r);padding:14px 16px;margin:22px 0 0;font-size:16px;line-height:1.5}
.note-box.why{background:var(--pine-soft)}
.note-box.miss{background:var(--ochre-soft)}
.note-box b{display:block;margin-bottom:2px}
.done-banner{display:flex;gap:10px;align-items:center;background:var(--pine-soft);border-radius:var(--r);padding:12px 14px;margin:20px 0 0;font-weight:700}
.secondary-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}

/* Sticky action bar */
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom))}
.actionbar-in{max-width:580px;margin:0 auto;display:flex;align-items:center;gap:12px}
.actionbar .meta{flex:1;min-width:0}
.actionbar .meta b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actionbar .meta span{font-size:14px;color:var(--ink-3)}
.actionbar .btn{flex:none}
.actionbar .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}

/* Empleo listing cards */
.seg{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:18px -20px 0;padding:2px 20px 4px}
.seg::-webkit-scrollbar{display:none}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 15px;font-weight:700;font-size:15px;white-space:nowrap;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.cards{display:grid;gap:24px;margin-top:18px}
@media (min-width:560px){ .cards{grid-template-columns:1fr 1fr} }
.card{position:relative}
.card > a{display:block;text-decoration:none;color:inherit}
.card .cover{aspect-ratio:4/3;border-radius:var(--r-lg)}
.card .heart{position:absolute;right:10px;top:10px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center;cursor:pointer;color:#1D2420;box-shadow:var(--shadow)}
.card .heart[aria-pressed="true"]{color:#C2391F}
.card .heart[aria-pressed="true"] svg{fill:currentColor}
.card .tag{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.94);color:#1D2420;font-size:13.5px;font-weight:700;padding:5px 11px;border-radius:999px;pointer-events:none}
.card-t{font-weight:700;font-size:17px;line-height:1.25;margin:12px 2px 2px}
.card-s{font-size:15px;color:var(--ink-3);margin:0 2px}
.review-cta{display:flex;align-items:center;gap:14px;background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r-lg);padding:14px 16px;margin-top:20px;text-decoration:none;color:inherit}
.review-cta .ic{width:46px;height:46px;border-radius:14px;background:var(--pine-soft);color:var(--pine);display:grid;place-items:center;flex:none}
.review-cta b{display:block}
.review-cta span{font-size:14.5px;color:var(--ink-3)}

/* Review mode */
.review{max-width:520px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 20px calc(130px + env(safe-area-inset-bottom))}
.progress{height:4px;background:var(--sunk);border-radius:4px;overflow:hidden;margin:6px 0 18px}
.progress i{display:block;height:100%;background:var(--pine);border-radius:4px;transition:width .25s}
.rcard{background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--shadow-lift);overflow:hidden}
.rcard .cover{aspect-ratio:5/4}
.rcard-b{padding:16px 18px 18px}
.rcard-t{margin:0 0 4px;font-size:23px;line-height:1.15;font-family:var(--display);font-weight:650}
.rcard .why{font-size:16px;color:var(--ink-2);margin:10px 0 0}
.review-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:100%}
.round{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:14.5px;cursor:pointer;color:var(--ink);min-height:64px}
.round.save{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
@media (prefers-reduced-motion: no-preference){
  .fly-left{animation:flyL .26s ease-in forwards} .fly-right{animation:flyR .26s ease-in forwards} .fly-up{animation:flyU .26s ease-in forwards}
  @keyframes flyL{to{transform:translateX(-120%) rotate(-8deg);opacity:0}}
  @keyframes flyR{to{transform:translateX(120%) rotate(8deg);opacity:0}}
  @keyframes flyU{to{transform:translateY(-30px) scale(.96);opacity:0}}
}

/* Agenda */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px;touch-action:pan-y}
.cal .wdh{font-size:13px;color:var(--ink-3);text-align:center;padding-bottom:2px}
.day{border:0;background:var(--surface);border-radius:14px;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;box-shadow:var(--shadow);color:inherit;padding:0}
.day .n{font-family:var(--display);font-weight:650;font-size:19px;line-height:1}
.day .dots{display:flex;gap:3px;height:6px}
.day .dots i{width:6px;height:6px;border-radius:50%}
.day.today{background:var(--ink);color:var(--bg)}
.day.off{background:transparent;box-shadow:none;color:var(--ink-3);cursor:default}
.day[aria-pressed="true"]:not(.today){outline:2.5px solid var(--ink)}
.dk-entrega{background:#D9932F} .dk-oportunidad{background:#2F8F6F} .dk-evento{background:#7D6CC4}
.month-bar{display:flex;align-items:center;justify-content:space-between;margin:14px -10px 0}
.month-bar .h2{font-size:21px}
.month-bar .icon-btn{color:var(--ink);width:48px;height:48px}
.month-bar .icon-btn:disabled{opacity:.3;cursor:default}
.today-link{margin:0 0 2px}
.cal > span{min-height:48px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-3);margin:12px 2px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%}

/* Empty */
.empty{background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--shadow);overflow:hidden}
.empty .cover{height:140px}
.empty-b{padding:16px 18px 20px}
.empty h3{font-family:var(--display);font-weight:650;font-size:22px;margin:0 0 4px}
.empty p{margin:0;color:var(--ink-2)}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:4px 12px calc(4px + env(safe-area-inset-bottom))}
.nav-in{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;font-size:13px;font-weight:700;color:var(--ink-3);text-decoration:none;position:relative}
.nav a[aria-current="page"]{color:var(--pine)}
.nav .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--rust);color:#fff;font-size:11px;display:grid;place-items:center}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 6px 6px 16px;min-height:46px;border-radius:14px;font-size:15px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none;display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);box-shadow:var(--shadow-lift)}
.toast.show{opacity:1;pointer-events:auto}
.toast:not(.has-undo){padding-right:16px}
#toast-msg{white-space:nowrap}
.toast button{border:0;background:transparent;color:var(--bg);font-weight:700;text-decoration:underline;padding:8px 10px;cursor:pointer;font-size:15px}
.foot{font-size:14px;color:var(--ink-3);margin:34px 4px 0}

@media (prefers-reduced-motion: no-preference){
  ::view-transition-old(root),::view-transition-new(root){animation-duration:.2s}
}
</style>
</head>
<body>

<main id="lock" class="lock hidden" aria-labelledby="lock-title">
  <form class="lock-card" id="lock-form" autocomplete="off">
    <div class="lock-art cover" id="lock-art"></div>
    <h1 id="lock-title">Hub</h1>
    <p>Escribe tu clave para abrir tu tablón.</p>
    <label for="pass" class="sr">Clave</label>
    <div class="field">
      <input id="pass" type="password" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="palabra-palabra-…-00" required>
      <button type="button" class="icon-btn" id="toggle-pass" aria-label="Mostrar la clave"></button>
    </div>
    <label class="check-row"><input type="checkbox" id="remember" checked> Recordar en este móvil</label>
    <button class="btn btn-primary btn-wide" id="unlock-btn" type="submit">Desbloquear</button>
    <p class="error" id="lock-error" role="alert"></p>
  </form>
</main>

<div id="view" class="hidden"></div>

<nav class="nav hidden" id="nav" aria-label="Secciones">
  <div class="nav-in">
    <a href="#/hoy" data-nav="hoy"><span data-icon="sun"></span>Hoy<span class="badge hidden" id="b-hoy"></span></a>
    <a href="#/agenda" data-nav="agenda"><span data-icon="calendar"></span>Agenda</a>
    <a href="#/empleo" data-nav="empleo"><span data-icon="briefcase"></span>Empleo<span class="badge hidden" id="b-empleo"></span></a>
  </div>
</nav>

<div id="actionbar" class="actionbar hidden"></div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-msg"></span><button type="button" id="toast-undo" class="hidden">Deshacer</button></div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);

/* ================= Icons ================= */
const P = {
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',

const TZ = "Europe/Madrid", pad = n => String(n).padStart(2, "0");

const addDays = (iso, n) => { const d = D(iso); d.setUTCDate(d.getUTCDate() + n); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; };

const shortDate = iso => fShort.format(D(iso)).replace(/\./g, "");
const longDate = iso => fLong.format(D(iso));
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
function rel(iso){
  if (!iso) return {t:"", c:"", exact:false};
  const n = diff(iso, todayISO());
  if (n === 0) return {t:"Hoy", c:"now"}; if (n === 1) return {t:"Mañana", c:"soon"};
  if (n > 1 && n <= 6) return {t:cap(fWd.format(D(iso))), c:"soon"};

  <button class="icon-btn" data-act="theme" aria-label="Cambiar entre modo claro y oscuro">${ic("moon")}</button>
  <button class="icon-btn" data-act="lock" aria-label="Bloquear la app">${ic("lock")}</button></div>`;
function rowHTML(it, opts){
  opts = opts || {}; const r = rel(it.date);
  return `<a class="row${isOff(it) ? " done" : ""}" href="${href(it.id)}">
    <div class="thumb">${cover(it.theme, it.id)}</div>
    <div class="row-main"><div class="row-title">${esc(it.title)}</div>${opts.sub && it.sub ? `<div class="row-sub">${esc(it.sub)}</div>` : ""}</div>
    ${isNew(it) && !opts.noNew ? `<span class="newdot" role="img" aria-label="Nuevo"></span>` : ""}
    ${r.t && !opts.noWhen ? `<span class="when ${r.c}">${esc(r.t)}</span>` : `<span class="chev">${ic("chev")}</span>`}
  </a>`;
}
function grouped(list, opts){
  const today = todayISO(), g = {late:[], week:[], later:[], none:[]};
  list.forEach(it => { if (!it.date) g.none.push(it); else { const n = diff(it.date, today); (n < 0 ? g.late : n <= 6 ? g.week : g.later).push(it); } });
  const block = (label, arr) => arr.length ? `<p class="group-label">${label}</p><div class="rows">${arr.sort(byDate).map(i => rowHTML(i, opts)).join("")}</div>` : "";
  return block("Ya ha pasado", g.late) + block("Esta semana", g.week) + block("Más adelante", g.later) + block("Sin fecha", g.none);
}
const emptyCard = (theme, title, text) => `<div class="empty">${cover(theme, title)}<div class="empty-b"><h3>${esc(title)}</h3>${text ? `<p>${esc(text)}</p>` : ""}</div></div>`;

/* ================= HOY ================= */
function pickFocus(){
  const today = todayISO(), ents = active("entrega").filter(e => diff(e.date, today) >= -1).sort(byDate), cors = items("correo").sort(byDate), ops = active("oportunidad").filter(o => o.date && diff(o.date, today) >= 0).sort(byDate);
  const urgent = ents.find(e => diff(e.date, today) <= 3);
  if (urgent) return {it:urgent, why:"Es lo más urgente"};
  if (cors.length) return {it:cors[0], why:`${cors[0].sub || "Alguien"} espera tu respuesta`};
  if (ents.length) return {it:ents[0], why:"Tu próxima fecha límite"};
  if (ops.length) return {it:ops[0], why:"Lo siguiente que puedes hacer"};
  return null;
}
function viewHoy(){
  const h = data.hoy || {}, today = todayISO();
  const hr = +new Intl.DateTimeFormat("en-GB", {timeZone:TZ, hour:"numeric", hour12:false}).format(new Date());
  const hello = hr >= 6 && hr < 14 ? "Buenos días, Maia" : hr >= 14 && hr < 21 ? "Buenas tardes, Maia" : "Buenas noches, Maia";
  const age = h.updated ? (Date.now() - new Date(h.updated)) / 36e5 : 0;
  const stale = age > 30 ? `<p class="stale" role="status">Estos datos son de ${esc(ago(h.updated))}. La actualización de esta mañana no ha llegado: pídele a Claude que revise la tarea «Hub: pestaña Hoy».</p>` : "";
  const f = pickFocus();
  const focus = f ? (() => { const r = rel(f.it.date);
      const pillTxt = f.it.kind === "correo" && f.it.date ? (diff(todayISO(), f.it.date) > 0 ? `Esperando ${diff(todayISO(), f.it.date)} ${diff(todayISO(), f.it.date) === 1 ? "día" : "días"}` : "Llegó hoy") : r.t;
      return `<a class="focus" href="${href(f.it.id)}"><div class="cover">${coverSVG(f.it.theme, f.it.id)}${pillTxt ? `<span class="pill${r.c ? " urgent" : ""}">${esc(pillTxt)}</span>` : ""}</div>
        <div class="focus-body"><div class="focus-kicker">${esc(f.why)}</div><h2>${esc(f.it.title)}</h2></div></a>`; })()
    : `<div style="margin-top:22px">${emptyCard("oportunidad", "Nada pendiente", "Hoy no hay fechas límite ni correos esperando. Disfruta el día.")}</div>`;
  const cats = ["entrega", "correo", "oportunidad", "aviso", "cambio"].map(k => ({k, list:active(k)})).filter(c => c.list.length || c.k === "entrega" || c.k === "correo");
  const tiles = cats.map(c => `<a class="tile${c.list.length ? "" : " empty-t"}" href="#/lista/${c.k}" aria-label="${KIND[c.k].many}: ${c.list.length}">
      ${cover(KIND[c.k].theme, "tile-" + c.k)}${c.list.some(isNew) ? `<span class="newdot"></span>` : ""}
      <div class="tile-body"><span class="tile-name">${KIND[c.k].many}</span><span class="tile-num">${c.list.length}</span></div></a>`).join("");
  const week = [...active("entrega"), ...active("oportunidad"), ...items("evento")]
    .filter(i => i.date && diff(i.date, today) >= 0 && diff(i.date, today) <= 6 && (!f || i.id !== f.it.id)).sort(byDate).slice(0, 4);
  return `<div class="page">${stale}
    <div class="top"><p class="eyebrow">${esc(cap(longDate(today)))}</p>${topTools()}</div>
    <h1 class="greet">${esc(hello)}</h1>
    ${focus}
    <div class="sec"><div class="sec-head"><h2 class="h2">Tu tablón</h2></div><div class="tiles">${tiles}</div></div>
    <div class="sec"><div class="sec-head"><h2 class="h2">Esta semana</h2><a class="link-btn" href="#/agenda">Ver agenda</a></div>
      ${week.length ? `<div class="rows">${week.map(i => rowHTML(i, {noNew:true})).join("")}</div>` : `<p class="lede">Ninguna otra fecha en los próximos 7 días.</p>`}</div>
    <p class="foot">Actualizado ${esc(ago(data.updated))}. Se revisa cada día a las 8:00.</p>
  </div>`;
}

/* ================= LISTA ================= */
function viewList(kind){
  if (!KIND[kind]) return viewHoy();
  const all = items(kind), off = all.filter(isOff), list = all.filter(i => !isOff(i));
  const empty = kind === "entrega" ? ["Todo entregado", "No te queda ninguna entrega pendiente. Bien hecho."] : kind === "correo" ? ["Nadie espera respuesta", "Estás al día con tus correos."] : ["Nada por aquí", "Cuando llegue algo nuevo aparecerá aquí."];
  return `<div class="page">
    <div class="top"><a class="back" href="#/hoy" data-act="back" data-fallback="#/hoy">${ic("back")} Hoy</a></div>
    <h1 class="page-title">${KIND[kind].many}</h1>
    ${list.length ? grouped(list, {sub: kind === "correo"}) : `<div style="margin-top:14px">${emptyCard(KIND[kind].theme, empty[0], empty[1])}</div>`}
    ${off.length ? `<p class="group-label">${kind === "entrega" ? "Hechas" : "Descartadas"}</p><div class="rows">${off.sort(byDate).map(i => rowHTML(i, {noWhen:true})).join("")}</div>` : ""}
  </div>`;
}

/* ================= DETAIL ================= */
const fact = (icon, k, v) => v ? `<li>${ic(icon)}<div><div class="fact-k">${esc(k)}</div><div class="fact-v">${esc(v)}</div></div></li>` : "";
function dateFact(iso){ if (!iso) return ""; const r = rel(iso), l = cap(longDate(iso)); return r.t && !r.exact ? `${l} · ${r.t.toLowerCase()}` : l; }
function bar(inner){ const b = $("actionbar"); b.innerHTML = `<div class="actionbar-in">${inner}</div>`; b.classList.remove("hidden"); }
function viewDetail(id){
  const it = idx[id];
  if (!it) return `<div class="page"><div class="top"><a class="back" href="#/hoy">${ic("back")} Hoy</a></div>${emptyCard("aviso", "Esto ya no está", "Se quitó del tablón porque ya pasó su fecha o se resolvió.")}</div>`;
  if (!state.seen[id]){ state.seen[id] = 1; save(); }
  const x = it.raw, link = safeUrl(x.enlace), isJob = it.kind === "oferta" || it.kind === "quizas";
  const fallback = isJob || it.kind === "candidatura" ? "#/empleo" : it.kind === "evento" ? "#/agenda" : "#/lista/" + it.kind;
  const openBtn = (label, cls) => link ? `<a class="btn ${cls || "btn-primary"}" href="${esc(link)}" target="_blank" rel="noopener">${esc(label)} ${ic("ext")}</a>` : "";
  let facts = "", body = "", extra = "";
  switch (it.kind){
    case "entrega": {
      const done = !!state.done[id];
      facts = fact("calendar", "Fecha", dateFact(x.fecha)) + fact("book", "Asignatura o trámite", x.asignatura) + fact("clock", "Hora", x.hora);
      body = x.detalle ? `<p class="prose">${esc(x.detalle)}</p>` : "";
      if (done) extra = `<div class="done-banner">${ic("check")} La marcaste como hecha</div>`;
      if (link) extra += `<div class="secondary-actions">${openBtn("Ver el original", "btn-ghost")}</div>`;
      bar(`<div class="meta"><b>${esc(rel(x.fecha).t || "")}</b><span>${done ? "Hecha" : "Pendiente"}</span></div>
        ${done ? `<button class="btn btn-ghost" data-act="undone" data-id="${esc(id)}">Desmarcar</button>` : `<button class="btn btn-primary" data-act="done" data-id="${esc(id)}">${ic("check")} Marcar como hecha</button>`}`);
      break; }
    case "correo":
      facts = fact("user", "De", x.de) + fact("calendar", "Recibido", x.fecha ? cap(longDate(x.fecha)) : "");
      body = x.resumen ? `<p class="prose">${esc(x.resumen)}</p>` : "";
      bar(`<div class="meta"><b>${esc(x.de || "")}</b><span>Espera tu respuesta</span></div>${openBtn("Abrir en Gmail")}`);
      break;
    case "oportunidad": {
      const v = state.interest[id];
      facts = fact("calendar", "Cuándo", dateFact(x.fecha)) + fact("tag", "Tipo", x.tipo) + fact("pin", "Dónde", x.lugar);
      body = x.detalle ? `<p class="prose">${esc(x.detalle)}</p>` : "";
      if (v === "si") extra = `<div class="done-banner">${ic("check")} Te interesa</div>`;
      if (link) extra += `<div class="secondary-actions">${openBtn("Ver el correo", "btn-ghost")}</div>`;
      bar(`<div class="two"><button class="btn btn-ghost" data-act="int" data-v="no" data-id="${esc(id)}">${v === "no" ? "Recuperar" : "No me interesa"}</button>
        <button class="btn ${v === "si" ? "btn-ghost" : "btn-primary"}" data-act="int" data-v="si" data-id="${esc(id)}">${v === "si" ? "Ya no me interesa" : "Me interesa"}</button></div>`);
      break; }
    case "aviso": case "cambio":
      facts = fact("calendar", "Fecha", x.fecha ? cap(longDate(x.fecha)) : "");
      body = (x.resumen || x.detalle) ? `<p class="prose">${esc(x.resumen || x.detalle)}</p>` : "";
      if (link) bar(`<div class="meta"><b>${esc(KIND[it.kind].one)}</b><span>${x.fecha ? esc(shortDate(x.fecha)) : ""}</span></div>${openBtn("Abrir correo")}`);
      break;
    case "evento":
      facts = fact("calendar", "Cuándo", dateFact(x.inicio) + (x.fin && x.fin !== x.inicio ? ` hasta el ${fDayMonth.format(D(x.fin))}` : "")) + fact("clock", "Hora", x.hora) + fact("pin", "Dónde", x.lugar);
      if (link) bar(`<div class="meta"><b>${esc(rel(x.inicio).t)}</b><span>En tu calendario</span></div>${openBtn("Abrir en Calendar")}`);
      break;
    case "candidatura":
      facts = fact("building", "Empresa", x.empresa) + fact("tag", "Estado", x.estado) + fact("calendar", "Última noticia", x.fecha ? cap(longDate(x.fecha)) : "");
      body = x.detalle ? `<p class="prose">${esc(x.detalle)}</p>` : "";
      if (link) bar(`<div class="meta"><b>${esc(x.estado || "")}</b><span>${esc(x.empresa || "")}</span></div>${openBtn("Abrir")}`);
      break;
    default: {
      const hidden = !!state.hidden[id];
      facts = fact("building", "Empresa", x.empresa) + fact("pin", "Dónde", [x.ubicacion, x.modalidad].filter(Boolean).join(", ")) + fact("layers", "Nivel", x.nivel) + fact("tag", "Área", x.area) + fact("mail", "Llegó por", [x.fuente, x.fecha ? shortDate(x.fecha) : ""].filter(Boolean).join(", el "));
      body = (x.porque ? `<div class="note-box why"><b>Por qué encaja</b>${esc(x.porque)}</div>` : "") + (it.kind === "quizas" && x.falta ? `<div class="note-box miss"><b>Lo que le falta</b>${esc(x.falta)}</div>` : "");
      extra = `<div class="secondary-actions"><button class="btn btn-ghost" data-act="hide" data-id="${esc(id)}">${hidden ? ic("eye") + " Volver a mostrar" : ic("eyeoff") + " Ocultar esta oferta"}</button></div>`;
      bar(`<div class="meta"><b>${esc(x.empresa || "")}</b><span>${esc(x.ubicacion || "")}</span></div>${openBtn("Ver oferta")}`);
    }
  }
  const saved = !!state.saved[id];
  const heart = isJob ? `<button class="hero-btn r" data-act="save" data-id="${esc(id)}" aria-pressed="${saved}" aria-label="${saved ? "Quitar de guardadas" : "Guardar oferta"}">${ic("heart", saved ? 'fill="currentColor"' : "")}</button>` : "";
  return `<article class="page detail">
    <div class="hero">${cover(it.theme, it.id)}
      <button class="hero-btn l" data-act="back" data-fallback="${fallback}" aria-label="Volver">${ic("back")}</button>${heart}</div>
    <div class="sheet">
      <p class="kind">${esc(KIND[it.kind].one)}</p>
      <h1 class="d-title">${esc(it.title)}</h1>
      ${isJob ? body : ""}
      ${facts ? `<ul class="facts">${facts}</ul>` : ""}
      ${isJob ? "" : body}${extra}
    </div></article>`;
}

/* ================= AGENDA (month view, navigable) ================= */
const fMonth = F({month:"long", year:"numeric"});
const monthOf = iso => iso.slice(0,7);
function shiftMonth(ym, n){ let [y, m] = ym.split("-").map(Number); m += n; while (m > 12){ m -= 12; y++; } while (m < 1){ m += 12; y--; } return `${y}-${pad(m)}`; }
function viewAgenda(arg){
  const today = todayISO(), thisMonth = monthOf(today);
  const selected = arg && arg.length === 10 ? arg : null;
  let ym = arg ? arg.slice(0,7) : thisMonth;
  if (ym < thisMonth) ym = thisMonth;
  const all = [...active("entrega"), ...active("oportunidad"), ...items("evento")].filter(i => i.date);
  const byDay = {}; all.forEach(i => { const k = i.date.slice(0,10); (byDay[k] = byDay[k] || []).push(i); });
  const first = ym + "-01", lead = (D(first).getUTCDay() + 6) % 7;
  const daysIn = new Date(Date.UTC(+ym.slice(0,4), +ym.slice(5,7), 0)).getUTCDate();
  let cells = ["L","M","X","J","V","S","D"].map(d => `<div class="wdh" aria-hidden="true">${d}</div>`).join("");
  for (let i = 0; i < lead; i++) cells += `<span aria-hidden="true"></span>`;
  for (let dn = 1; dn <= daysIn; dn++){
    const iso = `${ym}-${pad(dn)}`, past = iso < today, its = byDay[iso] || [];
    const dots = [...new Set(its.map(x => x.kind))].map(k => `<i class="dk-${k}"></i>`).join("");
    cells += `<button class="day${iso === today ? " today" : ""}${past ? " off" : ""}" ${past ? "disabled" : ""} data-act="day" data-day="${iso}" aria-pressed="${selected === iso}" aria-label="${esc(cap(longDate(iso)))}${its.length ? `, ${its.length} ${its.length === 1 ? "cosa" : "cosas"}` : ""}"><span class="n">${dn}</span><span class="dots">${dots}</span></button>`;
  }
  const label = d => { const r = rel(d); return r.exact ? cap(longDate(d)) : `${r.t}, ${fDayMonth.format(D(d))}`; };
  const monthName = cap(fMonth.format(D(first)));
  let list;
  if (selected){
    const its = (byDay[selected] || []).sort(byDate);
    list = `<p class="group-label">${esc(label(selected))}</p>${its.length ? `<div class="rows">${its.map(i => rowHTML(i, {noWhen:true, noNew:true})).join("")}</div>` : `<p class="lede">Día libre.</p>`}
      <button class="link-btn" data-act="day" data-day="${ym}" style="margin-top:8px">Ver todo ${esc(fMonth.format(D(first)).replace(/ de \d+$/, ""))}</button>`;
  } else {
    const inMonth = all.filter(i => monthOf(i.date) === ym && i.date.slice(0,10) >= today).sort(byDate), days = [...new Set(inMonth.map(i => i.date.slice(0,10)))];
    const later = all.filter(i => monthOf(i.date) > ym).sort(byDate)[0];
    list = days.length ? days.map(d => `<p class="group-label">${esc(label(d))}</p><div class="rows">${inMonth.filter(i => i.date.slice(0,10) === d).map(i => rowHTML(i, {noWhen:true, noNew:true})).join("")}</div>`).join("")
      : emptyCard("evento", ym === thisMonth ? "Nada más este mes" : "Mes despejado", later ? `Lo siguiente es el ${fDayMonth.format(D(later.date))}.` : "Aún no hay fechas apuntadas para este mes.");
  }
  const prevOk = ym > thisMonth;
  return `<div class="page">
    <div class="top"><p class="eyebrow">Tus fechas, mes a mes</p>${topTools()}</div>
    <h1 class="greet">Agenda</h1>
    <div class="month-bar">
      <button class="icon-btn" data-act="month" data-ym="${shiftMonth(ym, -1)}" ${prevOk ? "" : "disabled"} aria-label="Mes anterior">${ic("back")}</button>
      <h2 class="h2" aria-live="polite">${esc(monthName)}</h2>
      <button class="icon-btn" data-act="month" data-ym="${shiftMonth(ym, 1)}" aria-label="Mes siguiente">${ic("chev")}</button>
    </div>
    ${ym !== thisMonth ? `<button class="link-btn today-link" data-act="month" data-ym="${thisMonth}">Volver a hoy</button>` : ""}
    <div class="cal" id="cal" role="group" aria-label="Calendario de ${esc(monthName)}">${cells}</div>
    <div class="legend" aria-hidden="true"><span><i class="dk-entrega"></i>Fecha límite</span><span><i class="dk-oportunidad"></i>Oportunidad</span><span><i class="dk-evento"></i>Evento</span></div>
    <div class="sec" style="margin-top:14px">${list}</div>
  </div>`;
}
// Swipe left/right on the calendar to change month
(function(){
  let x0 = null, y0 = null;
  document.addEventListener("touchstart", e => { if (e.target.closest("#cal")){ x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; } }, {passive:true});
  document.addEventListener("touchend", e => {
    if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) < 50 || Math.abs(dy) > Math.abs(dx)) return;
    const btn = document.querySelectorAll('.month-bar [data-act="month"]')[dx < 0 ? 1 : 0];
    if (btn && !btn.disabled) btn.click();
  }, {passive:true});
})();

/* ================= EMPLEO ================= */
function jobCard(it){
  const x = it.raw, saved = !!state.saved[it.id];
  const tag = it.kind === "quizas" ? "Le falta algo" : x.prioridad === 1 ? "En Murcia" : isNew(it) ? "Nueva" : "";
  return `<div class="card">
    <a href="${href(it.id)}">${cover(it.theme, it.id)}<p class="card-t">${esc(x.puesto)}</p><p class="card-s">${esc([x.empresa, x.ubicacion].filter(Boolean).join(", "))}</p></a>
    ${tag ? `<span class="tag">${esc(tag)}</span>` : ""}
    <button class="heart" data-act="save" data-id="${esc(it.id)}" aria-pressed="${saved}" aria-label="${saved ? "Quitar de guardadas" : "Guardar"}: ${esc(x.puesto)}">${ic("heart")}</button>
  </div>`;
}
const jobSort = (a, b) => (a.raw.prioridad || 9) - (b.raw.prioridad || 9) || byDate(b, a);
function viewEmpleo(tab){
  tab = tab || "encajan";
  const of = items("oferta").filter(i => !state.hidden[i.id]).sort(jobSort), qz = items("quizas").filter(i => !state.hidden[i.id]).sort(jobSort);
  const saved = [...of, ...qz].filter(i => state.saved[i.id]), hidden = [...items("oferta"), ...items("quizas")].filter(i => state.hidden[i.id]);
  const cands = items("candidatura").sort(byDate);
  const toReview = [...of, ...qz].filter(i => !state.saved[i.id] && !state.later[i.id]).length;
  const list = tab === "quizas" ? qz : tab === "guardadas" ? saved : tab === "ocultas" ? hidden : of;
  const E = {encajan:["Sin ofertas nuevas", "El lunes se vuelven a revisar LinkedIn y las demás plataformas."], quizas:["Nada en duda", "Aquí salen las ofertas a las que solo les falta una cosa."], guardadas:["Aún no has guardado ninguna", "Toca el corazón de una oferta para tenerla aquí."], ocultas:["No has ocultado nada", ""]}[tab] || ["", ""];
  const seg = [["encajan", `Encajan · ${of.length}`], ["quizas", `Quizás · ${qz.length}`], ["guardadas", `Guardadas · ${saved.length}`]].concat(hidden.length ? [["ocultas", `Ocultas · ${hidden.length}`]] : [])
    .map(([k, l]) => `<button data-act="tab" data-tab="${k}" aria-pressed="${tab === k}">${l}</button>`).join("");
  return `<div class="page">
    <div class="top"><p class="eyebrow">${data.empleo && data.empleo.updated ? "Revisado el " + esc(shortDate(data.empleo.updated)) : "Becas y prácticas"}</p>${topTools()}</div>
    <h1 class="greet">Empleo</h1>
    ${cands.length ? `<div class="sec"><div class="sec-head"><h2 class="h2">Tus candidaturas</h2></div><div class="rows">${cands.map(i => rowHTML(i, {sub:true})).join("")}</div></div>` : ""}
    ${toReview > 1 ? `<a class="review-cta" href="#/revisar"><span class="ic">${ic("stack")}</span><div><b>Revisar de una en una</b><span>${toReview} ofertas sin decidir. Guarda o descarta sin ver el resto.</span></div></a>` : ""}
    <div class="seg" role="group" aria-label="Filtrar ofertas">${seg}</div>
    ${list.length ? `<div class="cards">${list.map(jobCard).join("")}</div>` : `<div style="margin-top:18px">${emptyCard("gestion", E[0], E[1])}</div>`}
    <p class="foot">Se actualiza cada lunes. Cada oferta se queda dos semanas.</p>
  </div>`;
}

/* ================= REVIEW (one at a time) ================= */
let reviewQueue = null, reviewTotal = 0, reviewSaved = 0;
function viewReview(){
  if (!reviewQueue){
    reviewQueue = [...items("oferta").sort(jobSort), ...items("quizas").sort(jobSort)].filter(i => !state.hidden[i.id] && !state.saved[i.id] && !state.later[i.id]).map(i => i.id);
    reviewTotal = reviewQueue.length; reviewSaved = 0;
  }
  const doneN = reviewTotal - reviewQueue.length;
  const top = `<div class="top"><button class="back" data-act="exit-review">${ic("back")} Empleo</button><span class="eyebrow">${reviewQueue.length ? `${doneN + 1} de ${reviewTotal}` : ""}</span></div>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${reviewTotal}" aria-valuenow="${doneN}"><i style="width:${reviewTotal ? doneN / reviewTotal * 100 : 100}%"></i></div>`;
  if (!reviewQueue.length){
    return `<div class="review">${top}${emptyCard("oportunidad", "Ya está", reviewSaved ? `Has guardado ${reviewSaved} ${reviewSaved === 1 ? "oferta" : "ofertas"}. Las tienes en «Guardadas».` : "Has revisado todas las ofertas pendientes.")}
      <div style="margin-top:16px"><button class="btn btn-primary btn-wide" data-act="exit-review">Volver a Empleo</button></div></div>`;
  }
  const it = idx[reviewQueue[0]], x = it.raw;
  bar(`<div class="review-actions">
    <button class="round" data-act="r-hide">${ic("eyeoff")} Descartar</button>
    <button class="round" data-act="r-later">${ic("later")} Luego</button>
    <button class="round save" data-act="r-save">${ic("heart")} Guardar</button></div>`);
  return `<div class="review">${top}
    <div class="rcard" id="rcard">${cover(it.theme, it.id)}
      <div class="rcard-b"><p class="kind">${esc([x.empresa, x.ubicacion].filter(Boolean).join(", "))}</p>
        <p class="rcard-t">${esc(x.puesto)}</p>
        <p class="why">${esc(it.kind === "quizas" && x.falta ? "Le falta: " + x.falta : (x.porque || ""))}</p>
        <a class="link-btn" href="${href(it.id)}">Ver todos los detalles</a></div>
    </div></div>`;
}
function reviewStep(kind){
  const id = reviewQueue && reviewQueue[0]; if (!id) return;
  if (kind === "save"){ state.saved[id] = Date.now(); reviewSaved++; }
  if (kind === "hide") state.hidden[id] = Date.now();
  if (kind === "later") state.later[id] = Date.now();
  save();
  const card = $("rcard"), anim = kind === "save" ? "fly-right" : kind === "hide" ? "fly-left" : "fly-up";
  const next = () => { reviewQueue.shift(); render(); };
  if (card && !matchMedia("(prefers-reduced-motion: reduce)").matches){ card.classList.add(anim); setTimeout(next, 240); } else next();
}

/* ================= Badges ================= */
function badges(){
  const today = todayISO();
  const hoyN = active("entrega").filter(e => diff(e.date, today) <= 2).length + items("correo").length;
  const empUpd = (data.empleo && data.empleo.updated) || "";
  const empN = state.empSeen === empUpd ? 0 : [...items("oferta"), ...items("candidatura")].filter(i => isNew(i) && !state.hidden[i.id]).length;
  $("b-hoy").textContent = hoyN; $("b-hoy").classList.toggle("hidden", !hoyN);
  $("b-empleo").textContent = empN; $("b-empleo").classList.toggle("hidden", !empN);
}

/* ================= Actions ================= */
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (b.tagName === "A") ev.preventDefault();
  switch (act){
    case "refresh": refresh(false); break;
    case "theme": toggleTheme(); break;
    case "lock": if (confirm("¿Bloquear la app? Tendrás que volver a escribir la clave para abrirla.")){ store.del(KEY_STORE); data = null; showLock("App bloqueada."); } break;
    case "back": goBack(b.dataset.fallback); break;
    case "done": state.done[id] = Date.now(); save(); toast("Marcada como hecha", () => { delete state.done[id]; save(); render(); }); goBack("#/lista/entrega"); break;
    case "undone": delete state.done[id]; save(); render(); break;
    case "int": { const prev = state.interest[id], v = b.dataset.v;
      if (prev === v) delete state.interest[id]; else state.interest[id] = v; save();
      if (state.interest[id] === "no"){ toast("Descartada", () => { if (prev) state.interest[id] = prev; else delete state.interest[id]; save(); render(); }); goBack("#/lista/oportunidad"); }
      else { render(); if (state.interest[id] === "si") toast("Apuntado: te interesa"); }
      break; }
    case "save": { const was = state.saved[id]; if (was) delete state.saved[id]; else state.saved[id] = Date.now(); delete state.later[id]; save(); render(); toast(was ? "Quitada de guardadas" : "Guardada"); break; }
    case "hide": { const was = state.hidden[id]; if (was) delete state.hidden[id]; else state.hidden[id] = Date.now(); save();
      if (!was){ toast("Oferta oculta", () => { delete state.hidden[id]; save(); render(); }); goBack("#/empleo"); } else render(); break; }
    case "tab": location.replace("#/empleo/" + b.dataset.tab); break;
    case "day": location.replace(b.dataset.day ? "#/agenda/" + b.dataset.day : "#/agenda"); break;
    case "month": if (!b.disabled) location.replace("#/agenda/" + b.dataset.ym); break;
    case "r-save": reviewStep("save"); break;
    case "r-hide": reviewStep("hide"); break;
    case "r-later": reviewStep("later"); break;
    case "exit-review": reviewQueue = null; goBack("#/empleo"); break;
  }
});

/* ================= Boot / lock ================= */
function showLock(msg){
  $("lock").classList.remove("hidden"); $("view").classList.add("hidden"); $("nav").classList.add("hidden"); $("actionbar").classList.add("hidden");
  $("lock-error").textContent = msg || ""; setTimeout(() => $("pass").focus(), 60);
}
function showApp(){ buildIndex(); $("lock").classList.add("hidden"); $("view").classList.remove("hidden"); current = location.hash || "#/hoy"; render(); }
async function refresh(silent){
  try{
    const fresh = await fetchEnv(); if (silent && env && fresh.iv === env.iv) return;
    const key = await cachedKey(fresh); if (!key){ env = fresh; showLock("Escribe la clave para cargar los datos nuevos."); return; }
    env = fresh; data = await decryptEnv(env, key); buildIndex(); render(); if (!silent) toast("Actualizado");
  }catch(e){ if (!silent) toast("No se ha podido actualizar"); }
}
async function boot(){
  $("lock-art").innerHTML = coverSVG("lock", "hub"); $("toggle-pass").innerHTML = ic("eye"); hydrateIcons(document);
  if (location.hash === "#hoy" || location.hash === "#empleo") history.replaceState(null, "", "#/" + location.hash.slice(1));
  try{ env = await fetchEnv(); }catch(e){ showLock("No se ha podido cargar el archivo de datos. Revisa la conexión y vuelve a abrir la app."); return; }
  const key = await cachedKey(env);
  if (key){ try{ data = await decryptEnv(env, key); showApp(); return; }catch(e){ store.del(KEY_STORE); } }
  showLock();
}
$("toggle-pass").addEventListener("click", () => { const i = $("pass"), show = i.type === "password"; i.type = show ? "text" : "password";
  $("toggle-pass").setAttribute("aria-label", show ? "Ocultar la clave" : "Mostrar la clave"); $("toggle-pass").innerHTML = ic(show ? "eyeoff" : "eye"); });
$("lock-form").addEventListener("submit", async ev => {
  ev.preventDefault(); const pass = $("pass").value.trim().toLowerCase(); if (!pass) return;
  if (!env){ try{ env = await fetchEnv(); }catch(e){ $("lock-error").textContent = "Sin conexión: no se pueden cargar los datos."; return; } }
  const btn = $("unlock-btn"); btn.disabled = true; btn.textContent = "Abriendo…"; $("lock-error").textContent = "";
  try{
    const key = await deriveKey(pass, b64d(env.salt), env.iter || 600000); data = await decryptEnv(env, key);
    if ($("remember").checked) store.set(KEY_STORE, {salt:env.salt, raw:b64e(await crypto.subtle.exportKey("raw", key))});
    $("pass").value = ""; showApp();
  }catch(e){ $("lock-error").textContent = "Clave incorrecta. Revisa los guiones y vuelve a probar."; }
  finally{ btn.disabled = false; btn.textContent = "Desbloquear"; }
});
document.addEventListener("visibilitychange", () => { if (!document.hidden && data) refresh(true); });
(function prune(){ const limit = Date.now() - 60 * 864e5;
  for (const k of ["done","saved","hidden","later"]) for (const id in state[k]) if (typeof state[k][id] === "number" && state[k][id] > 1 && state[k][id] < limit) delete state[k][id];
  save(); })();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
boot();
})();
</script>
